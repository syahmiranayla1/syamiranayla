<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Beranda</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background-color: #ffc0cb; /* merah muda */
      color: #4a1f2c;
      min-height: 100vh;
    }

    nav {
      background-color: #f48fb1;
      padding: 12px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.15);
    }

    nav ul {
      list-style: none;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 10px;
    }

    nav a {
      display: block;
      text-decoration: none;
      color: #fff;
      background-color: #ec407a;
      padding: 10px 20px;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }

    nav a:hover,
    nav a.aktif {
      background-color: #c2185b;
      transform: translateY(-2px);
    }

    .selamat {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 70vh;
    }

    .selamat h1 {
      font-size: 3.5rem;
      color: #c2185b;
      text-align: center;
    }

    @media (max-width: 600px) {
      .selamat h1 {
        font-size: 2.2rem;
      }
      nav a {
        padding: 8px 14px;
        font-size: 0.9rem;
      }
    }
  </style>
</head>
<body>

  <nav>
    <ul>
      <li><a href="index.html" class="aktif">Beranda</a></li>
      <li><a href="biodata.html">Biodata</a></li>
      <li><a href="gallery.html">Gallery</a></li>
      <li><a href="video.html">Video</a></li>
      <li><a href="tugas.html">Tugas Selanjutnya</a></li>
    </ul>
  </nav>

  <div class="selamat">
    <h1>Selamat Datang</h1>
  </div>

</body>
</html>
